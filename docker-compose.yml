version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hotkopiv1-app
    container_name: hotkopiv1-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:delegated
    environment:
      APACHE_RUN_USER: www-data
      APACHE_RUN_GROUP: www-data
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hotkopiv1
      DB_USERNAME: root
      DB_PASSWORD: semicircle123
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
  db:
    image: mysql:8.2
    container_name: hotkopiv1-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hotkopiv1
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
volumes:
  db_data:
